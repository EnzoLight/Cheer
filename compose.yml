services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CHEER_API_URL: ${VITE_CHEER_API_URL:-https://cheerapi.astrum.app.br}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    image: ${APP_IMAGE:-cheer-frontend:local}
    restart: unless-stopped
    ports:
      - '5173:80'
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      traefik.http.routers.cheer-frontend.rule: Host(`${HOST:?defina HOST no arquivo .env}`)
      traefik.http.routers.cheer-frontend.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.cheer-frontend.tls: ${TRAEFIK_TLS:-true}
      traefik.http.routers.cheer-frontend.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.cheer-frontend.loadbalancer.server.port: '80'
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
